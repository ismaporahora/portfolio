<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body { font-family: 'Figtree', system-ui, sans-serif; background: #E7E4DD; -webkit-font-smoothing: antialiased; }

  @keyframes cf-rise-kf { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @keyframes gh-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  .gh-caret { animation: gh-blink 1s step-start infinite; }
  .gh-sug:hover { background: #F4F0FC !important; border-color: rgba(0,0,0,.16) !important; }

  .gh-range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--acc, #6D28D9); border: 3px solid #fff; box-shadow: 0 2px 7px rgba(11,27,102,.28); cursor: pointer; }
  .gh-range::-moz-range-track { height: 6px; border-radius: 6px; background: transparent; }
  @keyframes gh-shimmer { 0% { background-position: -420px 0; } 100% { background-position: 420px 0; } }
  .gh-sk { background: linear-gradient(90deg, #ECEAE4 25%, #F5F3ED 37%, #ECEAE4 63%); background-size: 800px 100%; animation: gh-shimmer 1.5s linear infinite; border-radius: 7px; }
  .gh-card:hover { border-color: rgba(109,40,217,.35) !important; box-shadow: 0 6px 20px -8px rgba(11,27,102,.18); }
  .ng-chip:hover { background: #F4F0FC !important; }
  @keyframes gh-slide-in { from { transform: translateX(100%); } to { transform: none; } }
  .gh-drawer { animation: gh-slide-in 260ms cubic-bezier(.2,.7,.3,1) both; }
  @keyframes gh-fade-kf { from { opacity: 0; } to { opacity: 1; } }
  .gh-fade { animation: gh-fade-kf 200ms ease both; }
  /* espera de producción: el chip late una vez, el tilde se dibuja, el riel va y vuelve */
  @keyframes gh-tick-kf { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .gh-tick { animation: gh-tick-kf 320ms ease-out; }
  @keyframes gh-draw-kf { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
  .gh-draw { stroke-dasharray: 24; animation: gh-draw-kf 380ms ease-out both; }
  @keyframes gh-rail-kf { 0% { left: -34%; } 100% { left: 100%; } }
  .gh-rail { animation: gh-rail-kf 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .gh-sk, .gh-drawer, .gh-fade, .cf-rise, .cf-pulse, .gh-caret, .gh-tick, .gh-draw { animation: none !important; }
    .gh-rail { animation: none !important; left: 0; width: 100% !important; opacity: .35; }
  }

  .proto-bar { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; justify-content: space-between;

  @media (max-width: 640px) { .proto-bar .note .long { display: none; } }
